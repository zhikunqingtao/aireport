critic_mode_hint: "per-section"
force_mode: "per-section"

rubrics_files:
  - "experts/stock-research-report-expert/references/structure_contract.md"
  - "experts/general-writer/references/quality-framework.md"
pass_score: 85
max_loops: 3

section_params:
  scope: "section"
  min_issues: 2
  min_instructions: 3
  must_check:
    - "信息来源标注完整性"
    - "数据准确性与时效性"
    - "信息密度是否达标"

full_params:
  scope: "full"
  min_issues: 3
  min_instructions: 5
  must_check:
    - "必备章节完整性"
    - "章节间逻辑连贯性"
    - "风险提示充分性（至少 3 条）"
    - "免责声明完整性"
    - "字数是否达到目标体量"

revision_params:
  scope: "revision"
  min_issues: 1
  min_instructions: 2

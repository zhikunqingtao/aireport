<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>AI 办公工具对比测评｜宇树科技</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --surface: rgba(255, 255, 255, 0.9);
      --text: #152033;
      --muted: #596579;
      --line: #dce3ed;
      --accent: #2457d6;
      --accent-dark: #173b99;
      --warning-bg: #fff8e6;
      --warning-line: #efc65a;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(58, 112, 255, 0.16), transparent 34rem),
        radial-gradient(circle at 90% 85%, rgba(26, 179, 148, 0.12), transparent 32rem),
        var(--bg);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
      padding: clamp(56px, 10vw, 112px) 0 64px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .lead {
      max-width: 720px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2vw, 1.25rem);
      line-height: 1.75;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 34px 0 44px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--accent-dark);
      background: var(--surface);
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(27, 45, 80, 0.08);
    }

    a.button.primary {
      border-color: var(--accent);
      color: white;
      background: var(--accent);
    }

    a.button:hover { transform: translateY(-1px); }
    a.button:focus-visible { outline: 3px solid rgba(36, 87, 214, 0.35); outline-offset: 3px; }

    .panel {
      padding: clamp(22px, 4vw, 32px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 20px 56px rgba(27, 45, 80, 0.08);
    }

    .panel h2 { margin: 0 0 12px; font-size: 1.1rem; }
    .panel p { margin: 0; color: var(--muted); line-height: 1.7; }

    .warning {
      margin-top: 16px;
      border-color: var(--warning-line);
      background: var(--warning-bg);
    }

    footer {
      margin-top: 36px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (prefers-reduced-motion: no-preference) {
      a.button { transition: transform 140ms ease, box-shadow 140ms ease; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">AI Report · Case Study</p>
    <h1>AI 办公工具<br>对比测评</h1>
    <p class="lead">宇树科技场景下的交互式数据报告。结果来自固定样本、固定测试流程与截至 2026-08-30 的产品状态。</p>

    <nav class="actions" aria-label="报告入口">
      <a class="button primary" href="case-studies/AI办公工具对比测评_宇树科技_截至2026-08-30.html">打开交互式报告</a>
      <a class="button" href="evidence.html">查看证据包说明</a>
    </nav>

    <section class="panel">
      <h2>如何理解本报告</h2>
      <p>测评结果只描述文档所列测试条件下的表现。产品版本、账号权限、提示词、网络环境和评测时间变化，都可能导致不同结果。</p>
    </section>

    <section class="panel warning">
      <h2>原始证据提示</h2>
      <p>随附证据包含未经脱敏删减的第三方内容、账户信息、设备路径或文档元数据。本版本选择保留完整原始证据；访问、下载或再发布者应自行评估隐私、凭据、保密与版权风险。</p>
    </section>

    <footer>AI Report · 静态发布入口</footer>
  </main>
</body>
</html>
